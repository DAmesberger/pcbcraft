[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# `format-lock` fingerprints the core's stored schema; `kicad-compare`
# reads the shipped defaults.
sparksmith-core.workspace = true
sparksmith-io.workspace = true
# `kicad-compare`: the KiCad import and the Gerber/Excellon comparison.
sparksmith-kicad.workspace = true
sparksmith-fabcheck.workspace = true
serde_json.workspace = true
# Hashes generator modules and their bundles, and the stored
# schema for format.lock (MIT OR Apache-2.0).
sha2.workspace = true
# Parses Rust for the UI container gate (MIT OR Apache-2.0; already in the tree).
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# `kicad-compare --features sketch`: SolidCraft's board sketch engine, so the
# outline imports as a board sketch, as the app and the CLI import it. Off by
# default: the gates never build Solidcraft.
sparksmith-solidcraft = { workspace = true, optional = true }

[features]
sketch = ["dep:sparksmith-solidcraft"]

[dev-dependencies]
# The version 1 to 2 converter's footprint test solves sourced footprints
# with the real evaluator and checks them fresh after conversion (tests
# only: the gates never build Solidcraft; `sparksmith-io` cannot depend on
# it).
sparksmith-solidcraft.workspace = true
# Planted source trees for the `no-builtin-data` gate's tests.
tempfile.workspace = true
