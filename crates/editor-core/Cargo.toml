[package]
name = "sparksmith-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lints]
workspace = true
[features]
# Test fixtures (`Engine::demo`) for other crates' tests, enabled only by
# their dev-dependencies; the shipped apps never build them.
test-fixtures = []

[dependencies]
sparksmith-units-derive.workspace = true
# Generator modules' wire types, codec and runtime interface (no
# interpreter): generated parts' provenance and expansion (GP1).
sparksmith-generator-abi = { workspace = true, features = ["nfc"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
rhai.workspace = true
sha2.workspace = true
i_overlay.workspace = true
qrcodegen = "1.8"

[dev-dependencies]
# The Gerber and Excellon readers the fabrication tests read files back with.
sparksmith-fabcheck.workspace = true
rqrr = { version = "0.10", default-features = false }
