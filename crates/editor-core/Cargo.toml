[package]
name = "pcbcraft-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lints]
workspace = true
[features]
# Test fixtures (`Engine::demo`) for other crates' tests, enabled only by
# their dev-dependencies; the shipped apps never build them.
test-fixtures = []

[dependencies]
pcbcraft-units-derive.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
rhai.workspace = true
sha2.workspace = true
i_overlay.workspace = true
qrcodegen = "1.8"

[dev-dependencies]
# The Gerber and Excellon readers the fabrication tests read files back with.
pcbcraft-fabcheck.workspace = true
rqrr = { version = "0.10", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

