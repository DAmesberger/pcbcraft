[package]
name = "sparksmith-automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sparksmith-core.workspace = true
sparksmith-io.workspace = true
sparksmith-generators.workspace = true
sparksmith-solidcraft.workspace = true
sparksmith-firmware.workspace = true
solidcraft-control.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
getrandom.workspace = true
thiserror.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[features]
# Solidcraft's span profiler compiled in, for the build profile benchmark
# (tests/build_profile.rs) only. A feature, not a dev-dependency feature:
# as a dev-dependency it was unified into every workspace test build, so
# `cargo test --workspace` and `cargo build -p sparksmith` each built
# Solidcraft's engine, document, kernel and UI crates in their own variant.
profile = ["sparksmith-solidcraft/profile"]

[[test]]
name = "build_profile"
required-features = ["profile"]

[dev-dependencies]
sparksmith-core = { workspace = true, features = ["test-fixtures"] }
tempfile.workspace = true
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["time"] }
# Rewrites a saved linked design as a newer SolidCraft would save it (the
# two-way check's tests).
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
