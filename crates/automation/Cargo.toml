[package]
name = "pcbcraft-automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pcbcraft-core.workspace = true
pcbcraft-io.workspace = true
pcbcraft-solidcraft.workspace = true
pcbcraft-firmware.workspace = true
solidcraft-control.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io"] }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[dev-dependencies]
tempfile.workspace = true
rmcp = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["time"] }
# Solidcraft's span profiler compiled in, for the build profile benchmark
# (tests/build_profile.rs) only.
pcbcraft-solidcraft = { workspace = true, features = ["profile"] }
