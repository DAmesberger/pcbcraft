[package]
name = "pcbcraft-solidcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Compile Solidcraft's span profiler in (`profile`, re-exported): off by
# default; the build profile benchmark (automation's tests/build_profile.rs)
# turns it on.
profile = ["solidcraft-engine/profile"]

[dependencies]
pcbcraft-core.workspace = true
solidcraft-engine.workspace = true
solidcraft-color.workspace = true
solidcore-record.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
# Element structure of SVG artwork (MIT); the same version Solidcraft's reader uses.
quick-xml = "0.41"
png = "0.18"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
js-sys = "0.3"
