[package]
name = "sparksmith-solidcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Compile Solidcraft's span profiler in (`profile`, re-exported): off by
# default; the build profile benchmark (automation's tests/build_profile.rs)
# turns it on.
profile = ["solidcraft-engine/profile"]
# Test fixtures (`Stack::default`) for other crates' tests, enabled only by
# their dev-dependencies; the product never builds them.
test-fixtures = ["sparksmith-core/test-fixtures"]

[dependencies]
sparksmith-core.workspace = true
solidcraft-engine.workspace = true
solidcraft-color.workspace = true
solidcraft-viewport.workspace = true
solidcore-record.workspace = true
serde.workspace = true
serde_json.workspace = true
i_overlay.workspace = true
schemars.workspace = true
thiserror.workspace = true
# Element structure of SVG artwork (MIT); the same version Solidcraft's reader uses.
quick-xml = "0.41"
png = "0.18"
base64 = "0.22"

[dev-dependencies]
sparksmith-core = { workspace = true, features = ["test-fixtures"] }
tempfile = "3"
# The parity of a generator module's chip model with the in-code builder.
sparksmith-generators.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
js-sys = "0.3"
