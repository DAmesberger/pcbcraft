[package]
name = "sparksmith-generator-sdk"
description = "Toolkit for writing Sparksmith generator modules: exports, parameters, drawing and land helpers, golden tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The workspace lints, except unsafe_code: denied, not forbidden, so the
# host-function import block (`host`) can allow it; an import has no safe
# spelling. No other unsafe code.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

# no_std + alloc: compiled into every generator module. Nothing here may
# embed host paths, time or other build-machine state (reproducible modules).
[dependencies]
sparksmith-generator-abi.workspace = true
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
# The request and response buffers between calls (MIT; already in the tree
# through wasmi).
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

# The module's allocator: the one `std` uses on this target (MIT OR Apache-2.0).
[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }
