[package]
name = "pcbcraft-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pcbcraft-core.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
pdf-writer.workspace = true
thiserror.workspace = true
tempfile.workspace = true
getrandom.workspace = true
# The `.pcbcraft` ZIP container (D0). MIT; DEFLATE through flate2 and
# zlib-rs (MIT OR Apache-2.0, Zlib). Licences checked by `cargo xtask licences`.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
pcbcraft-core = { workspace = true, features = ["test-fixtures"] }
