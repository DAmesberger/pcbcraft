[workspace]
resolver = "3"
members = [
    "crates/editor-core",
    "crates/units-derive",
    "crates/io",
    "crates/solidcraft-integration",
    "crates/automation",
    "crates/firmware",
    "crates/assist",
    "crates/generator-abi",
    "crates/generator-sdk",
    "crates/generators",
    "crates/generators-probe",
    "crates/generators-fixture",
    "crates/fabcheck",
    "crates/kicad",
    "generators/chip",
    "apps/sparksmith-cli",
    "crates/ui",
    "apps/sparksmith",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sparksmith-core = { path = "crates/editor-core" }
sparksmith-units-derive = { path = "crates/units-derive" }
sparksmith-io = { path = "crates/io" }
sparksmith-solidcraft = { path = "crates/solidcraft-integration" }
sparksmith-automation = { path = "crates/automation" }
sparksmith-firmware = { path = "crates/firmware" }
sparksmith-assist = { path = "crates/assist" }
sparksmith-generator-abi = { path = "crates/generator-abi" }
sparksmith-generator-sdk = { path = "crates/generator-sdk" }
sparksmith-generators = { path = "crates/generators" }
sparksmith-ui = { path = "crates/ui" }
sparksmith-fabcheck = { path = "crates/fabcheck" }
sparksmith-kicad = { path = "crates/kicad" }
tempfile = "3"
sha2 = "0.10"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1.2"
thiserror = "2"
# The official MCP SDK (Apache-2.0), serving protocol 2026-07-28 only;
# pinned exactly, since it ships breaking releases often (docs/mcp-surface.md).
rmcp = { version = "=3.9.0", default-features = false }
tokio = { version = "1", default-features = false }
# Vector PDF output (schematic printing, fabrication drawings). MIT OR Apache-2.0.
pdf-writer = "0.15"
i_overlay = { version = "9.1", default-features = false }
rhai = { version = "=1.27.0", default-features = false, features = ["std", "sync", "no_module", "no_time"] }
egui = "0.37"
egui-wgpu = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
solidcraft-engine = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
# Solidcraft's colour rules (the sRGB transfer function), reached through sparksmith-solidcraft and
# the vendored UI kit; the same revision.
solidcraft-color = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
# The vector types of Solidcraft's public API live in solidcore's record crate, which Solidcraft
# vendors at solidcore/: the same fork revision, so it is the copy Solidcraft builds with.
solidcore-record = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
# Solidcraft's control channel (per-session token files, the loopback JSON-lines
# server) for live MCP into the open window; the same revision, reached through
# sparksmith-automation only.
solidcraft-control = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
# Solidcraft's shared viewport renderer: its shading models (surface, clear coat, material
# graph) and, in the desktop app, its GPU pipelines and egui paint callbacks; the same revision.
solidcraft-viewport = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
solidcraft-viewport-gpu = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
solidcraft-viewport-egui = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
# Solidcraft's vector geometry, widget registry and interface text, which the vendored UI kit
# (crates/ui) draws with; the same revision.
solidcraft-geom = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
solidcraft-ui-registry = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
solidcraft-ui-text = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

# Adopted from Solidcraft: optimized dependencies and a CI profile that avoids
# truck debug assertions while retaining checked arithmetic in our code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
debug-assertions = false
overflow-checks = true

[profile.ci.package."*"]
opt-level = 2
debug = false

# Generator modules (`generators/*`, built by `cargo xtask generators build`):
# small, panic-free and byte-reproducible. A module's SHA-256 is its identity,
# recorded in generators/modules.lock, so every setting here is part of it.
[profile.generator]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = 0
incremental = false
overflow-checks = true

# Cargo does not inherit a dependency workspace's patches. Keep Solidcraft's
# geometry fixes pinned to the exact same revision as its engine.
[patch.crates-io]
egui-wgpu = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
winit = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "64bebfef0a77dab8c79666114c7601c9dda55d12" }
