[workspace]
resolver = "3"
members = [
    "crates/editor-core",
    "crates/io",
    "crates/solidcraft-integration",
    "crates/automation",
    "crates/firmware",
    "crates/assist",
    "apps/pcbcraft-cli",
    "apps/pcbcraft",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
pcbcraft-core = { path = "crates/editor-core" }
pcbcraft-io = { path = "crates/io" }
pcbcraft-solidcraft = { path = "crates/solidcraft-integration" }
pcbcraft-automation = { path = "crates/automation" }
pcbcraft-firmware = { path = "crates/firmware" }
pcbcraft-assist = { path = "crates/assist" }
tempfile = "3"
sha2 = "0.10"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1.2"
thiserror = "2"
# The official MCP SDK (Apache-2.0), serving protocol 2026-07-28 only;
# pinned exactly, since it ships breaking releases often (docs/mcp-surface.md).
rmcp = { version = "=3.9.0", default-features = false }
tokio = { version = "1", default-features = false }
# Vector PDF output (schematic printing, fabrication drawings). MIT OR Apache-2.0.
pdf-writer = "0.15"
i_overlay = { version = "9.1", default-features = false }
rhai = { version = "=1.27.0", default-features = false, features = ["std", "sync", "no_module", "no_time"] }
egui = "0.37"
egui-wgpu = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit"] }
solidcraft-ui-egui = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "c26590edb55e5edfe962bc1004fc538efd58eed8" }
solidcraft-engine = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "c26590edb55e5edfe962bc1004fc538efd58eed8" }
# Solidcraft's colour rules (the sRGB transfer function), reached through pcbcraft-solidcraft, and
# its UI token contract, which the UI kit uses; the same revision.
solidcraft-color = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "c26590edb55e5edfe962bc1004fc538efd58eed8" }
solidcraft-theme = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "c26590edb55e5edfe962bc1004fc538efd58eed8" }
# The vector types of Solidcraft's public API live in solidcore's record crate, which Solidcraft
# vendors at solidcore/: the same fork revision, so it is the copy Solidcraft builds with.
solidcore-record = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "c26590edb55e5edfe962bc1004fc538efd58eed8" }
# Solidcraft's control channel (per-session token files, the loopback JSON-lines
# server) for live MCP into the open window; the same revision, reached through
# pcbcraft-automation only.
solidcraft-control = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "c26590edb55e5edfe962bc1004fc538efd58eed8" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

# Adopted from Solidcraft: optimized dependencies and a CI profile that avoids
# truck debug assertions while retaining checked arithmetic in our code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
debug-assertions = false
overflow-checks = true

[profile.ci.package."*"]
opt-level = 2
debug = false

# Cargo does not inherit a dependency workspace's patches. Keep Solidcraft's
# geometry fixes pinned to the exact same revision as its engine.
[patch.crates-io]
egui-wgpu = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "c26590edb55e5edfe962bc1004fc538efd58eed8" }
winit = { git = "https://github.com/DAmesberger/solidcraft.git", rev = "c26590edb55e5edfe962bc1004fc538efd58eed8" }
