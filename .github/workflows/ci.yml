name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  native-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify native code and wasm library
        run: cargo xtask ci
