name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  native-and-wasm:
    name: native-and-wasm (${{ matrix.os }})
    strategy:
      # Each OS reports on its own: a failure on one does not cancel the other.
      fail-fast: false
      matrix:
        # Windows runs only on pushes to main and manual runs; Ubuntu on
        # every push, pull request and manual run.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache Cargo registry, git dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          # The wasm checks build into their own target directories.
          workspaces: |
            . -> target
          cache-all-crates: true
          # Keep the build when tests fail, so the next run reuses it.
          cache-on-failure: true
      # Includes the generator modules: built for wasm32, compared with
      # the committed library/generators/*/*.wasm (not on Windows) and
      # their golden cases run natively, under wasmi and under wasm32 wasmi.
      - name: Verify native code, wasm library and generator modules
        run: cargo xtask ci
