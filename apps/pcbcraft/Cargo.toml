[package]
name = "pcbcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The workspace lints, except unsafe_code: denied, not forbidden, so that
# src/open_documents.rs (macOS file-open events) can allow it: it has no safe
# API. Keep the rest in sync with [workspace.lints], as Solidcraft's app does.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[dependencies]
pcbcraft-core.workspace = true
pcbcraft-io.workspace = true
pcbcraft-solidcraft.workspace = true
pcbcraft-automation.workspace = true
pcbcraft-assist.workspace = true
solidcraft-ui-egui.workspace = true
solidcraft-viewport-egui.workspace = true
solidcraft-theme.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
eframe.workspace = true
serde_json.workspace = true
rfd = "0.17"
pollster = "0.4"
spade = "2.15"

# The macOS menu bar (src/native_menu.rs), as Solidcraft's: its Quit asks
# about unsaved work instead of ending the app at once. Its Paste reads the
# clipboard with arboard, which egui-winit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
arboard = { version = "3.7", default-features = false }
# Files opened from Finder and the Dock (src/open_documents.rs), as Solidcraft's;
# all already come with eframe and rfd.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSNotification", "NSOperation", "NSString", "NSURL"] }
block2 = "0.6"

[dev-dependencies]
pcbcraft-core = { workspace = true, features = ["test-fixtures"] }
tempfile.workspace = true
